<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden - TennisFinder</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='tennis-booking-icon.svg') }}">
    <link rel="icon" type="image/png" sizes="180x180" href="{{ url_for('static', filename='tennis-booking-icon.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='tennis-booking-icon.png') }}">
    <meta name="theme-color" content="#2E7D32">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #2c3e50;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Tennis court lines background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(to right, rgba(232, 255, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(232, 255, 0, 0.05) 1px, transparent 1px);
            background-size: 80px 80px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 450px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo a {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
            text-decoration: none;
        }

        .logo-accent {
            color: #E8FF00;
            text-shadow: 0 0 20px rgba(232, 255, 0, 0.3);
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            color: #5a6c7d;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #2c3e50;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            color: #2c3e50;
        }

        .form-group input:focus {
            outline: none;
            border-color: #E8FF00;
            background: rgba(255, 255, 255, 0.7);
        }

        .form-group input::placeholder {
            color: #8a9bab;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: #E8FF00;
        }

        .checkbox-group label {
            color: #5a6c7d;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #E8FF00 0%, #FFD700 100%);
            color: #2c3e50;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 5px 15px rgba(232, 255, 0, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(232, 255, 0, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error {
            background: rgba(231, 76, 60, 0.15);
            color: #c0392b;
            padding: 14px 16px;
            border-radius: 10px;
            border-left: 4px solid #c0392b;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .footer-link {
            text-align: center;
            margin-top: 25px;
            color: #5a6c7d;
            font-size: 14px;
        }

        .footer-link a {
            color: #2c3e50;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer-link a:hover {
            color: #E8FF00;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #5a6c7d;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #2c3e50;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <a href="{{ url_for('landing') }}">Tennis<span class="logo-accent">Finder</span></a>
        </div>

        <div class="auth-card">
            <div class="header">
                <h1>Willkommen zurück</h1>
                <p>Melde dich an, um Tennisplätze zu buchen</p>
            </div>

            <div class="error" id="error"></div>

            <form id="loginForm" onsubmit="login(event)">
                <div class="form-group">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" name="email" placeholder="deine@email.at" required>
                </div>

                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" name="password" placeholder="Dein Passwort" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember_me" name="remember_me">
                    <label for="remember_me">Angemeldet bleiben</label>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">Anmelden</button>
            </form>

            <div class="footer-link">
                Noch kein Konto? <a href="{{ url_for('auth.register_page') }}">Jetzt registrieren</a>
            </div>
        </div>

        <div class="back-link">
            <a href="{{ url_for('landing') }}">← Zurück zur Startseite</a>
        </div>
    </div>

    <script>
        async function login(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember_me = document.getElementById('remember_me').checked;

            // Hide previous errors
            document.getElementById('error').style.display = 'none';

            // Disable button
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Wird angemeldet...';

            try {
                const response = await fetch('login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, remember_me })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Anmeldung fehlgeschlagen');
                }

                // Login successful - redirect to home
                window.location.href = '{{ url_for("landing") }}';

            } catch (error) {
                document.getElementById('error').textContent = error.message;
                document.getElementById('error').style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Anmelden';
            }
        }
    </script>
</body>
</html>
