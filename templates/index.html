<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platzsuche - TennisFinder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #2c3e50;
            min-height: 100vh;
            padding: 20px;
        }

        /* Tennis court lines background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(to right, rgba(232, 255, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(232, 255, 0, 0.05) 1px, transparent 1px);
            background-size: 80px 80px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 10px 0;
        }

        .logo a {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
            text-decoration: none;
        }

        .logo-accent {
            color: #E8FF00;
            text-shadow: 0 0 20px rgba(232, 255, 0, 0.3);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-email {
            color: #5a6c7d;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-btn {
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-btn-primary {
            background: linear-gradient(135deg, #E8FF00 0%, #FFD700 100%);
            color: #2c3e50;
            box-shadow: 0 4px 12px rgba(232, 255, 0, 0.3);
        }

        .nav-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(232, 255, 0, 0.4);
        }

        .nav-btn-secondary {
            background: rgba(255, 255, 255, 0.3);
            color: #2c3e50;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .nav-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
        }

        /* Search Box */
        .search-title {
            font-size: 24px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .search-input {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            color: #2c3e50;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #E8FF00;
            background: rgba(255, 255, 255, 0.7);
        }

        .search-input::placeholder {
            color: #8a9bab;
        }

        .btn-search {
            padding: 16px 40px;
            background: linear-gradient(135deg, #E8FF00 0%, #FFD700 100%);
            color: #2c3e50;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 5px 15px rgba(232, 255, 0, 0.3);
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(232, 255, 0, 0.4);
        }

        .btn-search:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .examples {
            color: #5a6c7d;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Search Options */
        .search-options {
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .option-label {
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 10px;
            display: block;
        }

        .toggle-group {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .toggle-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            background: transparent;
            color: #5a6c7d;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #E8FF00 0%, #FFD700 100%);
            color: #2c3e50;
            box-shadow: 0 4px 12px rgba(232, 255, 0, 0.3);
        }

        .checkbox-group {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            color: #2c3e50;
        }

        .checkbox-label input {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: #E8FF00;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 50px;
            display: none;
        }

        .loading h3 {
            color: #2c3e50;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .loading p {
            color: #5a6c7d;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(232, 255, 0, 0.3);
            border-top-color: #E8FF00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Messages */
        .message {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 15px;
        }

        .message.success {
            background: rgba(46, 204, 113, 0.15);
            color: #27ae60;
            border-left: 4px solid #27ae60;
        }

        .message.error {
            background: rgba(231, 76, 60, 0.15);
            color: #c0392b;
            border-left: 4px solid #c0392b;
        }

        /* Results */
        .results {
            display: none;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .result-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #2c3e50;
        }

        .result-info {
            color: #5a6c7d;
            font-size: 14px;
        }

        /* Slot Cards */
        .slot {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #E8FF00;
            transition: all 0.3s ease;
        }

        .slot:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.7);
        }

        .slot.preferred {
            background: rgba(232, 255, 0, 0.15);
            border-left-color: #FFD700;
        }

        .slot.preferred::before {
            content: "Empfohlen";
            display: inline-block;
            background: linear-gradient(135deg, #E8FF00 0%, #FFD700 100%);
            color: #2c3e50;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .slot-venue {
            font-weight: 600;
            color: #2c3e50;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .slot-time {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .slot-detail {
            color: #5a6c7d;
            margin: 5px 0;
            font-size: 14px;
        }

        .slot-actions {
            margin-top: 15px;
        }

        .book-btn {
            padding: 12px 25px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .book-btn:hover {
            background: #219a52;
            transform: translateY(-2px);
        }

        .book-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* Trainer Slots */
        .slot.trainer {
            border-left-color: #27ae60;
            background: rgba(46, 204, 113, 0.1);
        }

        .slot.trainer:hover {
            background: rgba(46, 204, 113, 0.2);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .user-menu {
                flex-wrap: wrap;
                justify-content: center;
            }

            .input-group {
                flex-direction: column;
            }

            .btn-search {
                width: 100%;
            }

            .checkbox-group {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <a href="{{ url_for('landing') }}">Tennis<span class="logo-accent">Finder</span></a>
            </div>
            <div class="user-menu">
                <span class="user-email" id="userEmail"></span>
                <a href="{{ url_for('chat_interface') }}" class="nav-btn nav-btn-primary">Chat Mode</a>
                <a href="{{ url_for('credentials_page') }}" class="nav-btn nav-btn-secondary">Zugangsdaten</a>
                <a href="{{ url_for('profile') }}" class="nav-btn nav-btn-secondary">Profil</a>
                <a href="{{ url_for('auth.logout') }}" class="nav-btn nav-btn-secondary">Abmelden</a>
            </div>
        </header>

        <div class="glass-card">
            <h1 class="search-title">Tennisplatz suchen</h1>
            <div class="input-group">
                <input type="text" id="timeframe" class="search-input"
                       placeholder='z.B. "morgen 18-20 Uhr" oder "nächsten Samstag nachmittag"'>
                <button onclick="search()" class="btn-search">Suchen</button>
            </div>
            <div class="examples">
                Beispiele: "morgen ab 17 Uhr" • "Dienstag 18-20 Uhr" • "am Wochenende vormittag"
            </div>

            <div class="search-options">
                <label class="option-label">Suchen nach:</label>
                <div class="toggle-group">
                    <button type="button" id="searchModeCourt" class="toggle-btn active" onclick="setSearchMode('court')">
                        Platz
                    </button>
                    <button type="button" id="searchModeTrainer" class="toggle-btn" onclick="setSearchMode('trainer')">
                        Trainer
                    </button>
                </div>

                <div id="locationSelector">
                    <label class="option-label">Standorte:</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="locationArsenal" value="arsenal" checked>
                            Arsenal (Das Spiel)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="locationPostSV" value="postsv" checked>
                            Post SV Wien
                        </label>
                    </div>
                </div>

                <div id="trainerNameField" style="display: none; margin-top: 15px;">
                    <input type="text" id="trainerName" class="search-input" placeholder="Trainer-Name (optional)">
                </div>
            </div>
        </div>

        <div class="glass-card loading" id="loading">
            <div class="spinner"></div>
            <h3>Suche läuft...</h3>
            <p>Das kann bis zu 60 Sekunden dauern</p>
        </div>

        <div class="message success" id="success"></div>
        <div class="message error" id="error"></div>

        <div class="glass-card results" id="results">
            <div class="result-header">
                <h2 id="resultTitle">Verfügbare Plätze</h2>
                <div class="result-info" id="result-info"></div>
            </div>
            <div id="slots"></div>
        </div>
    </div>

    <script>
        // Check authentication status on page load
        async function checkAuth() {
            try {
                const response = await fetch('auth/status');
                const data = await response.json();

                if (!response.ok || !data.authenticated) {
                    window.location.href = '{{ url_for("auth.login_page") }}';
                    return;
                }

                if (data.user && data.user.email) {
                    document.getElementById('userEmail').textContent = data.user.email;
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = '{{ url_for("auth.login_page") }}';
            }
        }

        checkAuth();

        let searchMode = 'court';

        function setSearchMode(mode) {
            searchMode = mode;
            const courtBtn = document.getElementById('searchModeCourt');
            const trainerBtn = document.getElementById('searchModeTrainer');
            const trainerNameField = document.getElementById('trainerNameField');
            const locationSelector = document.getElementById('locationSelector');

            if (mode === 'court') {
                courtBtn.classList.add('active');
                trainerBtn.classList.remove('active');
                trainerNameField.style.display = 'none';
                locationSelector.style.display = 'block';
            } else {
                courtBtn.classList.remove('active');
                trainerBtn.classList.add('active');
                trainerNameField.style.display = 'block';
                locationSelector.style.display = 'none';
            }
        }

        function normalizeInput(text) {
            text = text.replace(/[""]/g, '"');
            text = text.replace(/['']/g, "'");
            text = text.replace(/[„"]/g, '"');
            text = text.replace(/[–—−]/g, '-');
            text = text.replace(/[\u00A0\u202F]/g, ' ');
            text = text.replace(/\s+/g, ' ');
            return text;
        }

        async function search() {
            let timeframe = document.getElementById('timeframe').value.trim();
            if (!timeframe) {
                document.getElementById('error').textContent = 'Bitte gib einen Zeitraum ein';
                document.getElementById('error').style.display = 'block';
                return;
            }

            timeframe = normalizeInput(timeframe);
            const trainerName = document.getElementById('trainerName').value.trim();

            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
            document.querySelector('.btn-search').disabled = true;

            try {
                const requestData = {
                    timeframe,
                    searchMode: searchMode
                };

                if (searchMode === 'trainer' && trainerName) {
                    requestData.trainerName = trainerName;
                }

                if (searchMode === 'court') {
                    requestData.locations = {
                        arsenal: document.getElementById('locationArsenal').checked,
                        postsv: document.getElementById('locationPostSV').checked
                    };
                }

                const response = await fetch('search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Suche fehlgeschlagen');
                }

                displayResults(data);
            } catch (error) {
                document.getElementById('error').textContent = error.message;
                document.getElementById('error').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.querySelector('.btn-search').disabled = false;
            }
        }

        let currentSlots = [];

        function displayResults(data) {
            const resultTitle = document.getElementById('resultTitle');
            const info = `${data.total} Ergebnis(se) für ${data.timeframe.day}, ${data.timeframe.date} (${data.timeframe.start} - ${data.timeframe.end})`;
            document.getElementById('result-info').textContent = info;
            document.getElementById('slots').innerHTML = '';

            if (data.searchMode === 'trainer') {
                resultTitle.textContent = 'Verfügbare Trainer';
                if (data.trainers && data.trainers.length > 0) {
                    document.getElementById('slots').innerHTML = generateTrainerSlots(data.trainers);
                } else {
                    document.getElementById('slots').innerHTML = '<p style="color: #5a6c7d; text-align: center; padding: 20px;">Keine Trainer verfügbar</p>';
                }
            } else {
                resultTitle.textContent = 'Verfügbare Plätze';
                currentSlots = data.slots;

                const slotsHtml = data.slots.map((slot, idx) => {
                    const preferred = idx === data.preferred_index ? 'preferred' : '';
                    return `
                        <div class="slot ${preferred}">
                            <div class="slot-venue">${slot.venue}</div>
                            <div class="slot-time">${slot.time}</div>
                            <div class="slot-detail">${slot.court_name}</div>
                            <div class="slot-detail">${slot.date} (${slot.day_of_week})</div>
                            <div class="slot-detail">${slot.price}</div>
                            <div class="slot-detail">${slot.location}</div>
                            <div class="slot-actions">
                                <button class="book-btn" onclick="bookSlotByIndex(${idx})">Jetzt buchen</button>
                            </div>
                        </div>
                    `;
                }).join('');

                document.getElementById('slots').innerHTML = slotsHtml || '<p style="color: #5a6c7d; text-align: center; padding: 20px;">Keine Plätze verfügbar</p>';
            }

            document.getElementById('results').style.display = 'block';
        }

        function generateTrainerSlots(trainers) {
            return trainers.map(trainer => `
                <div class="slot trainer">
                    <div class="slot-venue">Trainer-Session</div>
                    <div class="slot-time">${trainer.time_start} - ${trainer.time_end}</div>
                    <div class="slot-detail">${trainer.price}</div>
                    <div class="slot-detail">${trainer.court_name}</div>
                    <div class="slot-detail">${trainer.date}</div>
                    <div class="slot-detail" style="margin-top: 10px; font-weight: 500;">Verfügbare Trainer:</div>
                    <div style="margin-left: 15px; margin-top: 5px;">
                        ${trainer.trainers.map(t => `
                            <div style="margin: 5px 0; color: #2c3e50;">
                                ✓ ${t.name}
                                ${t.training_types ? ` (${t.training_types.join(', ')})` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function bookSlotByIndex(index) {
            const slot = currentSlots[index];
            if (!slot) {
                alert('Slot nicht gefunden');
                return;
            }
            bookSlot(slot);
        }

        async function bookSlot(slot) {
            const confirmMsg = `${slot.court_name} am ${slot.date} um ${slot.time} buchen?`;
            if (!confirm(confirmMsg)) return;

            document.getElementById('success').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.querySelectorAll('.book-btn').forEach(btn => btn.disabled = true);

            try {
                const response = await fetch('book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ slot })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Buchung fehlgeschlagen');
                }

                document.getElementById('success').textContent = `✓ ${data.message}`;
                document.getElementById('success').style.display = 'block';
                document.getElementById('success').scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                document.getElementById('error').textContent = `✗ ${error.message}`;
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').scrollIntoView({ behavior: 'smooth' });
            } finally {
                document.querySelectorAll('.book-btn').forEach(btn => btn.disabled = false);
            }
        }

        document.getElementById('timeframe').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') search();
        });
    </script>
</body>
</html>
